name: Weekly Editorial Draft
on:
  schedule:
    - cron: '0 0 * * 1'  # Monday 09:00 Korea Standard Time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  create-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate editorial draft
        run: python scripts/create_draft.py
      - name: Save the new draft to the repository
        run: |
          if [ -z "$(git status --porcelain drafts)" ]; then
            echo "No new draft"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts/
          git commit -m "Add weekly Busan editorial review draft"
          git push
